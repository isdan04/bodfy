ransportación ¡El puente Einstein-Rosen sí existe! Era de noche y estando en el patio de la casa, bajo las limas, empezó a salir la luna en el horizonte, papá apuntó al cielo y me dijo: "Mira Topo, allá está el conejo de la luna", yo volteé buscando la figura pero no lograba verlo. Antes que perdiera el interés, me explicó: "¿Ves las orejas?, están arriba ahí mira, y abajo están las patas ¿Lo ves?" ¡Síii!, contesté con asombro. No parpadeaba. Imaginaba. No comprendía. Fascinado pregunté: ¿Papá, allá están los gringos?, "Sí", me dijo con ternura. Esa noche fue trascendental. Magia extasiante. Deslumbrante. Ahí supe que la vida es una fantasía, que papá era una maravillosa fantasía. Era un presagio. Ya murió y sigo escuchando sus risas ¿Ví hombrecitos en la Luna? ¿Caminaban dentro de mi cabeza? No sé qué pasó por mi tatema, nunca había visto televisión, no conocía los comics pulp fiction y aún faltaba un año para ir a la escuela. El auto más grande que había visto era el carro jalado con caballos de los vecinos Ventura y Caciano, sus placas decían “Tracción animal". El transporte más rápido donde me había subido era la carreta de Don Santos, que relinchaba a 10 kph por el Tábare-Galera-China, con  llantas  nalga de tigre, para que llegaran las conchas y cochitos calientitos ¿Acaso imaginé que yo volaba? ¿Doblé el espacio y viajé a velocidad warp a la luna? Creo que por ese pasaje al Topo le gusta "Dune", "Star Wars" y " The Expanse” ¡Te amo plan Zeta!, gritaba Plankton, cuando creía que por fin, robaría la receta secreta de la Cangreburger. 
Papá es Sosán. Reservado. Diligente. Contemplativo. Es la risa que florece del silencio, la alegría que irrumpe sin causa y la vida sin pretensiones. Papá es la Locura. Mamá la Cordura. En el amor hay grietas, en el enojo hay semillas. Papá es el Tao, es el agua que se infiltra, no impone el rumbo, pero sostiene el río. La familia es un círculo donde la luz se esparce en la sombra. El Tao es la unión del yin y el yang. Uno es raíz, otro viento, uno es fuego que protege, otro agua que consuela. Mitad abrazo, mitad distancia. Sin papá, la historia de la familia sería diferente. El matrimonio precisa de un cómplice, un aliado que respalde sin dudar y proteja sin desertar. Para mi mamá, ese hombre fue don Manuel, más conocido en el mundo del salitre, el chamizo y los drenes, como el "Bosam sisiboqui", apodo en dialecto mayo que significa "Bolsa de fierro". Una especie en extinción. Arcilla que rehúsa la forma. Bicho raro que no vino a encajar. Nunca he conocido a alguien tan desprendido de las vicisitudes de la vida. Libertad intrínseca irrompible. Si  mamá quería conectarnos al mundo, papá cortaba los cables. Trabajador incansable por más de setenta años ¿Por qué nunca se cansaba? Porque amaba trabajar. Cultivar la tierra era su oración ¿Su templo?  El cielo en su sombrero. Cristo dice: “Dónde está tu tesoro, allí estará también tu corazón". Papá era la tierra, lo veía en sus ojos, se paraba en el bordo del canal, él no veía tierra, él era la tierra. Trabajador sin horarios, oficinas, patrones o vicios. Jamás durmió fuera de casa, nunca se desveló, salvo por trabajo o sus hijos. Con solo primaria, anclado en un ejido, rodeado de trigales y maizales, erigió un linaje que lo vió vivir, dormir y morir bajo el abrigo del hogar. Ahora veo hombres con postgrados abandonando a su esposa e hijos. Papá es mil veces más hombre que esas frágiles conciencias ¿O acaso vas a decir que los tiempos han cambiado? Si es así, entonces no eres frágil, eres la ciudad, piensas como las masas, qué lástima de título ¡Sigues en parvulito! El Bolsadefierro fue un tipo sin calendario, llegó a este mundo con la revolución mexicana, pisó tierras de nativos milenarios ¡Más de mil años de huellas! Para él no había días festivos ni fines de semana ¡Qué gran enseñanza para los Godínez enjaulados de hoy! Algunos Boomers y Millenials dirán: ¡Qué aburrido! Los Centennials preguntarán: ¿Qué es el matrimonio? Pero los astutos Alfa pensarán: ¿Es posible ese lujo personal? El “Hsin Hsin Ming” de Sosán es el retrato de papá.
Sosán me enseñó, sin pizarrón ni intención, lo que el mundo ha perdido: encontrar la belleza en la soledad, conservarse intacto en el mundo del anhelo y el halago, y hablar sin insinuaciones ni vaguedades ¡Sí!, así es ¿Lo notaron? Papá era un estoico susurrando a tu oído, un silente Sosán del monte Sikóng. Místico. Mudo. Innato. Tan natural que ni él mismo lo sabía. No conocía la palabra sabiduría y ahí residía su grandeza. Es una rara combinación de Lao Tsé y Epicteto. Él me hizo filósofo ¡Gracias, mi viejo! Fue un hombre difícil, muy difícil de leer. Una tesis doctoral. La personalidad se desvela como cebolla, capa tras capa, hasta llegar donde el ser se reconoce puro y desnudo. Mamá era fácil de descifrar, ella fue una manifestación del mundo. Papá, llano en la superficie, complejo en las profundidades, parecía envuelto en un aura insondable. Lo percibía cuando lo llevaba en su vocho al Oraba. En casa lo volvía loco el entorno, pero en el vocho, entre tierras, chamizos y canales, se asomaba el gran hombre que fue ¡Qué afortunados somos los que vimos su misterio!  Yo lo quise mucho. Lo extraño, fue mi primer amigo. Mamá me esculpió. Él me transformó. Jamás habló de Dios. Gracias a él lo encontré. En el camino al Júpare, yo manejaba y él dormía. Entrelazaba sus manos, respiraba sin ruido. No dormía, algo sucedía. Tardé en verlo, era un aura de paz ¿El capacete lo arropaba? Bajaba las revoluciones al motor, ansiaba que ese momento durara más. Dejaba sonar el radio, buscaba un camino sin permanente para no perturbarlo. Hace veinte años me empezó a pasar lo mismo, dicen los gurús hindúes que se hereda. Lo empiezo a creer. Es transformador. Papá es de oriente, mamá de occidente. Mamá se enamoró de Sosán, cuando lo vió montado en su mula Noragua, gritó en su cabeza: “Éste hommmbre no se toca, te lo juuuro amiga míaaa, defenderéee su amor como una locaaa” ¿La chispa inicial? Mayo de 1938 ¿El único testigo? Un inmenso Laurel ¿Los ingredientes secretos? Una mirada cándida femenina y un fulgor indómito masculino. Sosán, 19 mayos. Scarlett, 13 eneros ¡Extraño esa lozanía! Esa noche, las cuerdas de Los Panchos arrullaron sueños idílicos: “Béeesameee, bésame muuucho, como si fuera esta noche la úuultima vez".
Papá es Shrek. Impulsivo. Valiente. Noble. Un grosero extremo. Mamá decía que tenía boca de infierno. Un día se agarraron del moco, y papá gritó desde el patio: "Les voy a tirar un violín por la ventana". Mamá me preguntó: ¿Qué es eso, Rodolfo? Fingí demencia, era mejor callar. Lo que más me divertía del Jefe es que se reía de mis locuras, no le asustaba que escuchara Heavy Metal, cortara camisetas o usara shorts. Que vistiera como cholo, me rapara o tatuara. Nomás agarraba cura. Recuerdo que decía: "Me gusta la música del Pito, le voy a poner un estéreo al carro". Mamá mostraba su cara bipolar, una mueca entre enojo y risa pícara contenida ¡Estaban curados mis viejos choris!. A Shrek no le gustaba el jardín de mamá, lo cuidaba a disgusto. ¡Pitooo, te necesito, luegooo!, me hablaba y me ponía a podar rosales y cortar el zacate. Para eso, me daba unas tijeras y un machete que tenía como cien años, envuelto hasta el mango con sus adoradas camisetas agujereadas ¡Inventó la camiseta eólica! Era un machete sin filo y oxidado, los remaches de la cacha se movían ¡Cuidado con darle a una piedra!, podría perder el filo "¡Uuujjjaaa! ¿Qué pasó?”, terminaba todo ampollado, quería un buen trabajo, las orillas del zacate tenían que ser derechitas y del mismo ancho, me gustaba complacerlo, éramos estetas los dos. Mamá, me pidió un día que matara el guajolote de navidad, lo estuvo engordando un mes en la piocha del patio trasero ¡Y papá sacó el maldito machete amellado! Pobre güíjolo, lo emborraché con vino y ya que andaba como papalote sin cola, le tuve que dar como diez machetazos porque ¡El pinchi machete no cortaba! Le molí a golpes el buche y terminé bañado en sangre ¿Y Shrek? ¡Riéndose de mí!.
¡Cómo chinnngan! ¡Todos! Era su grito de guerra, su amor por la soledad le hacía protestar ante las fiestas y sólo se calmaba cuando veía que prendían el carbón, mamá decía: "Ya se le alzaron las orejas al lobo". La carne roja lo volvía loco, seguro se llevó a la tumba un millón de vacas fileteadas. Hombre de gran apetito, se acercaba al asador  al estilo Fox y Castro:  "Cenas y te vas". Cuando estaba en secundaria, mamá hacía tortillas de harina y me daba en el desayuno, antes de las siete de la mañana. A mediodía llegaba y ya se habían acabado. Por meses mamá le alcahueteó a Shrek hasta que metí presión. Mamá lo delató ¡Papá se las robaba, las escondía en su vitrina del año 1945, y se las comía a escondidas en el limón! Hacía como si estuviera viendo el árbol  mientras engullía la tascari. Ahí lo caché con las manos en la masa. Era un vaquetón. Desde entonces, se empezó a mochar y ahora mi amá y yo éramos los alcahuetes. Nos fue bien un tiempo, lo sé porque la Jefatura dejó de decir: "Este hombre me quiere hacer la vida de cuadritos". El box era el deporte que le gustaba ver a Shrek, se apasionaba ¡Le valía madre! Parecía un niño chiquito ¡Se metía en la pelea! Recuerdo que una noche veíamos en la TV, de cuatro patas marca Telefunken, la pelea de Pedroza vs Zárate por allá a finales de los 70s, cuando un round se puso intenso el viejo se empezó a levantar de la silla capeándose  los golpes y tirando ganchos y sabanazos. Mamá lo veía desde la cocina, por la escotilla de la puerta, se moría de la risa. Shrek imaginó que Zárate era el Güero Cózarit en aquel dren, y le volvió a surtir unos  moquetazos. Ganó Pedroza. Papá repitió toda la semana: "Peeedrooozaaa". Mamá meneaba la cabeza, agitaba su dedo índice alrededor de la oreja, movía los labios sin articular y decía: "Está desconchinflado". 
Una vez nos tocó a Nico y a mí verlo pelear por el agua de riego en el poblado La Esquina. Papá había puesto sus costales en la compuerta del Oraba, pero no subía lo suficiente el nivel del agua, algo pasaba en el canal ¿Pero qué chingado?, dijo consternado. Nico era el chofer, Shrek el copiloto y yo de mitotero. Era de noche, fuimos a revisar compuertas. En una de ellas, papá encontró un joven girando la rueda del volante. Empezó el cotorreo. El intruso, un ingeniero recién desempacado, le explicó a papá que, según la mecánica de fluidos, era posible regar ambas parcelas como él lo había ajustado. Todos sabemos que convencer al Sisiboqui estaba ¡Cabrón! El malnacido era un novato, respetuoso pero insistente. Papá ya tenía cincuenta años siendo agricultor y en su gremio empírico se rumoraba que: "No le puedes enseñar rezos a un cura". El chilorio del "Porky's" taladraba en su cabeza: ¡Dale en el hocico! Se dijeron de palabras, el malhechor con respeto y papá sin ceder un milímetro. Pasó un minuto. El chilorio perforó su cráneo ¡Quería salir! y Shrek gritó: ¡A mí enséñame a parir! Nico y yo nos asustamos. Fue un gritote, el bribón dejó todo como decía papá y se fue. Seguro terminó en un diván terapéutico. Papá, felizmente encabronado pudo regar sin problemas su cultivo. Se le bajó el chilorio. Pelear le despertaba el apetito. Cenó chicharrones del "Porky's" con unas tortillucas de harineruca. 
Aborrecía que Elmer dijera: "Papi, te quiero". Reprobaba con la cabeza y gruñía: "Cabrón jaretudo". Repelía a los mandilones, sinónimo de inservible para su léxico. Tenía apodos para sus cuñados que mamá defendía con tanto ahínco ¡Alégale al ampayer! Era de alto calibre, no le ganabas una, Jorge le decía el Musulungo Herrera. Un día se hizo análisis de sangre y salió fuera de rango, rezongaba: ¿Qué saben esos doctores? Mamá se divertía: "Mira, Pito, ahí va el químico". Era lo que él creía y punto. Esculpido en una pieza. Mi hermano Elmer, preocupado por su salud, lo llevaba al homeópata, le compraba una bolsa de chochos y regresaba a México con la tranquilidad de cuidar a su genitor. Al otro día, Shrek las tiraba a la basura. Mamá lo regañaba. No hacía caso a nadie. Indómito. Mustang en la llanura, ¡Hiiii! ¡Hiiii! ¡Frrrttt! El pavimento, su pradera. Huatabampo, su matorral. ¡Ayuuu, Silver!

        // Variables globales
        let currentChapterIndex = 0;

        // Elementos del DOM
        const chapterSelect = document.getElementById('chapter-select');
        const fontSizeSelect = document.getElementById('font-size');
        const themeSelect = document.getElementById('theme-select');
        const chapterContent = document.getElementById('chapter-content');
        const prevChapterBtn = document.getElementById('prev-chapter');
        const nextChapterBtn = document.getElementById('next-chapter');
        const chapterIndicator = document.getElementById('chapter-indicator');

        // Inicializar la aplicación
        function initApp() {
            populateChapterSelect();
            loadChapter(currentChapterIndex);
            updateChapterIndicator();
            
            // Event listeners
            chapterSelect.addEventListener('change', () => {
                currentChapterIndex = parseInt(chapterSelect.value);
                loadChapter(currentChapterIndex);
                updateChapterIndicator();
            });
            
            fontSizeSelect.addEventListener('change', () => {
                const sizeClass = fontSizeSelect.value;
                chapterContent.className = `reader-content ${sizeClass} slide-in`;
            });
            
            themeSelect.addEventListener('change', () => {
                toggleTheme(themeSelect.value === 'dark');
            });
            
            prevChapterBtn.addEventListener('click', () => {
                if (currentChapterIndex > 0) {
                    currentChapterIndex--;
                    loadChapter(currentChapterIndex);
                    chapterSelect.value = currentChapterIndex;
                    updateChapterIndicator();
                }
            });
            
            nextChapterBtn.addEventListener('click', () => {
                if (currentChapterIndex < chapters.length - 1) {
                    currentChapterIndex++;
                    loadChapter(currentChapterIndex);
                    chapterSelect.value = currentChapterIndex;
                    updateChapterIndicator();
                }
            });
        }

        // Llenar el selector de capítulos
        function populateChapterSelect() {
            chapters.forEach((chapter, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `CAP. ${index + 1}: ${chapter.title}`;
                chapterSelect.appendChild(option);
            });
        }

        // Cargar contenido del capítulo y formatear párrafos
        function loadChapter(index) {
            const chapter = chapters[index];
            
            // Dividir el contenido en párrafos y formatear
            const paragraphs = chapter.content.split('\n').filter(p => p.trim() !== '');
            let formattedContent = '';
            
            paragraphs.forEach(paragraph => {
                formattedContent += `<p class="paragraph">${paragraph.trim()}</p>`;
            });
            
            chapterContent.innerHTML = `
                <h2 class="text-2xl md:text-3xl font-bold text-primary mb-4 chapter-title">${chapter.title}</h2>
                <div>${formattedContent}</div>
            `;
            
            // Aplicar clase de animación
            chapterContent.classList.add('slide-in');
            setTimeout(() => {
                chapterContent.classList.remove('slide-in');
            }, 300);
        }

        // Actualizar indicador de capítulo
        function updateChapterIndicator() {
            chapterIndicator.textContent = `Capítulo ${currentChapterIndex + 1} de ${chapters.length}`;
        }

        // Alternar tema claro/oscuro
        function toggleTheme(dark) {
            if (dark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // Iniciar la aplicación cuando se carga el DOM
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
